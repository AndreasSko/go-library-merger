name: Release
on:
  pull_request:
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release snapshot
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/go/src/github.com/AndreasSko/go-library-merger" \
            -w /go/src/github.com/AndreasSko/go-library-merger \
            goreleaser/goreleaser-cross:v1.25 \
            release --snapshot --clean

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish release and Homebrew formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN -e HOMEBREW_TOKEN \
            -v "$GITHUB_WORKSPACE:/go/src/github.com/AndreasSko/go-library-merger" \
            -w /go/src/github.com/AndreasSko/go-library-merger \
            goreleaser/goreleaser-cross:v1.25 \
            release --clean
